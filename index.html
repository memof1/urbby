<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urbby · Publicaciones</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --bg: #f8fafd;
      --panel: #ffffff;
      --accent: #0b57d0;
      --accent-soft: #e8f0fe;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    a {
      display: flex;
      min-height: 150px;
      padding: 20px;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 12px 28px rgba(60, 64, 67, 0.14);
      outline: none;
      transform: translateY(-2px);
    }

    h2 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .tag {
      width: fit-content;
      margin-top: 18px;
      padding: 6px 10px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Urbby</h1>
      <p>Publicaciones preparadas para consulta.</p>
    </header>

    <section class="grid" aria-label="Publicaciones disponibles">
      <a href="urbby-roadmap-launch.html">
        <h2>Roadmap de Lanzamiento Marketplace</h2>
        <span class="tag">Abrir</span>
      </a>

      <a href="urbby-metricas-junta.html">
        <h2>Plan de Metricas del Portal Administrativo</h2>
        <span class="tag">Abrir</span>
      </a>

      <a href="Presupuesto-Desarrollo-A%C3%B1o1.html">
        <h2>Presupuesto Departamento de Desarrollo Ano 1</h2>
        <span class="tag">Abrir</span>
      </a>
    </section>
  </main>
</body>
</html>
